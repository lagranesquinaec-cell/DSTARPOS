<style>
/* Layout: barra superior fija con navegación; Venta = catálogo + carrito lado a lado, el resto son tablas y formularios */
:root{
  --bg:#F5F4FA; --surface:#FFFFFF; --surface2:#ECEAF4; --line:#DAD7E6;
  --fg:#1C1933; --muted:#66637F; --accent:#5557AE; --accent-fg:#FFFFFF; --accent-soft:#E6E6F7;
  --ok:#14774C; --ok-bg:#DDF2E8; --warn:#9A5806; --warn-bg:#FBEBCF; --bad:#BD2430; --bad-bg:#FBE0E2;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --r1:8px; --r2:12px; --shadow:0 1px 2px rgba(30,25,80,.05),0 6px 18px -10px rgba(30,25,80,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12111C; --surface:#1B1A29; --surface2:#262439; --line:#35334C; --fg:#EEECFB; --muted:#A3A0C0;
  --accent:#A9ABF2; --accent-fg:#1A1B44; --accent-soft:#2A2B58;
  --ok:#52C78F; --ok-bg:#16352A; --warn:#EBA63F; --warn-bg:#3A2B12; --bad:#FF8087; --bad-bg:#401D22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12111C; --surface:#1B1A29; --surface2:#262439; --line:#35334C; --fg:#EEECFB; --muted:#A3A0C0;
  --accent:#A9ABF2; --accent-fg:#1A1B44; --accent-soft:#2A2B58;
  --ok:#52C78F; --ok-bg:#16352A; --warn:#EBA63F; --warn-bg:#3A2B12; --bad:#FF8087; --bad-bg:#401D22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
h2{font-size:20px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.r,th.r,.money{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto}
/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 16px;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1440px;margin:0 auto}
.brand{font-family:var(--font-head);font-weight:700;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);border:0}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;max-width:1440px;margin-inline:auto;scrollbar-width:thin}
nav a{padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on svg{color:var(--accent)}
nav a.on{color:var(--fg);border-bottom-color:var(--accent)}
nav a:hover{color:var(--fg)}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r1);padding:8px 14px;font-weight:600;min-height:38px;transition:background .15s,filter .15s,transform .05s}.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)} .btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:var(--bad)} .btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f input,label.f select{font-weight:400;color:var(--fg)}
label.ck{display:flex;align-items:center;gap:8px;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 220px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:12px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);position:sticky;top:0}
td.r,th.r{text-align:right} tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface2)}
td.wrapc{white-space:normal;min-width:180px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile-s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;box-shadow:var(--shadow)}
.tile-s b{display:block;font-family:var(--font-head);font-size:24px;margin-top:2px}
.tile-s span{font-size:12px;color:var(--muted);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.bad{background:var(--bad-bg);color:var(--bad)}
/* venta */
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;min-height:92px;justify-content:space-between}
.tile:hover{border-color:var(--accent)} .tile .tn{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.tile .tp{font-family:var(--font-head);font-weight:700;font-size:17px;color:var(--accent)} .tile .tc{font-size:11px;color:var(--muted)}
.tile.off{opacity:.55}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
.cart>div{padding:12px 14px} .cart .lines{overflow-y:auto;flex:1;min-height:120px;padding:0 14px;border-block:1px solid var(--line)}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .ln{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.line .lt{font-family:var(--font-head);font-weight:700;text-align:right}
.line .ctl{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.line .ctl input{width:64px;min-height:30px;padding:3px 6px;text-align:right}
.line .ctl .q{width:48px;text-align:center}
.step{width:30px;min-height:30px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;font-weight:700;padding:0}
.tot{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.tot .big{font-family:var(--font-head);font-size:28px;font-weight:700;grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .pri{grid-column:1/-1;font-size:17px;min-height:48px}
@media(max-width:860px){.pos{grid-template-columns:1fr}.cart{position:static;max-height:none}}
/* modal */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto}
#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,8,25,.55)}
.dlg{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r2) + 2px);width:100%;max-width:520px;padding:18px;margin:auto;display:flex;flex-direction:column;gap:14px}
.dlg.wide{max-width:820px}
.dlg .hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg .ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,420px)}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.payrow{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center}
.payinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.due{font-family:var(--font-head);font-size:34px;font-weight:700}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:2px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:10px;text-align:left;display:grid;gap:6px;min-height:0}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tcard .sw{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid rgba(128,128,128,.3)}.tcard .sw i{flex:1}
.tcard b{font-size:13px}.tcard span{font-size:12px;color:var(--muted)}
.tkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 16px}
.tkprev{background:#fff;color:#000;border:1px dashed #999;border-radius:6px;padding:12px;font-family:'Courier New',monospace;font-size:12px;max-width:300px;width:100%}
.tkprev h4{margin:0;text-align:center;font-size:14px}.tkprev .c{text-align:center}.tkprev hr{border:0;border-top:1px dashed #000}.tkprev table{width:100%;border-collapse:collapse}.tkprev td,.tkprev th{padding:1px 0;border:0;background:none;color:#000;font-size:12px;text-transform:none;letter-spacing:0;white-space:normal;position:static}.tkprev .r{text-align:right}
.cust{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cust label{display:flex;align-items:center;gap:10px;font-weight:600}.cust input[type=color]{width:42px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.paymodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.paymodes .btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.payrow.single{grid-template-columns:1fr}.payrow.single label{display:none}
.quick{display:flex;gap:6px;flex-wrap:wrap}
/* ticket */
.ticket{background:#fff;color:#111;font-family:'Courier New',ui-monospace,monospace;font-size:12.5px;padding:14px;border-radius:8px;border:1px dashed #999;max-width:340px;margin:0 auto;width:100%}
.ticket h4{margin:0;text-align:center;font-size:15px} .ticket .c{text-align:center} .ticket hr{border:0;border-top:1px dashed #555;margin:6px 0}
.ticket table{width:100%;border-collapse:collapse} .ticket td,.ticket th{padding:1px 0;border:0;background:none;color:#111;font-size:12.5px;text-transform:none;letter-spacing:0;white-space:normal;position:static}
.ticket .r{text-align:right}
/* chart */
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px;border-bottom:1px solid var(--line)}
.chart .b{flex:1;min-width:6px;background:var(--accent);border-radius:3px 3px 0 0;position:relative}
.chart .b:hover{filter:brightness(1.15)}
.xl{display:flex;gap:4px;font-size:10px;color:var(--muted)} .xl span{flex:1;text-align:center;min-width:6px;overflow:hidden}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}

.sbar{display:flex;gap:10px;margin-bottom:8px}
input.big{font-size:18px;min-height:54px;padding:10px 16px;border-width:2px}
input.big:focus{border-color:var(--accent);outline:none}
.sale{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:16px;align-items:start}
.side{display:grid;gap:12px;min-width:0}
.cartw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:280px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 128px 120px 70px 88px 74px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow.ch{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-block:8px}
.crow input{min-height:34px;padding:4px 8px;text-align:right}
.crow .cq{display:flex;gap:4px;align-items:center}.crow .cq input{text-align:center;width:50px;padding:4px}
.crow .ct{text-align:right;font-family:var(--font-head);font-weight:700;font-size:17px}
.crow .cn b{font-weight:600;overflow-wrap:anywhere;display:block}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cgrid .s2{grid-column:1/-1}
.change{padding:12px 16px;border-radius:12px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface2)}
.change b{font-family:var(--font-head);font-size:34px}
.change.ok{background:var(--ok-bg);color:var(--ok)}.change.bad{background:var(--bad-bg);color:var(--bad)}
input.bigin{font-size:26px;min-height:58px;font-weight:700;text-align:right}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.pkrow{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;margin-bottom:6px;align-items:center}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,2.5fr) 76px 72px 64px;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.ph{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-block:8px}
.prow:not(.ph){cursor:pointer}.prow:not(.ph):hover{background:var(--surface2)}
.prow .pn b{display:block;font-weight:600;overflow-wrap:anywhere}
.pp{display:flex;gap:6px;flex-wrap:wrap}
.pr{display:inline-flex;flex-direction:column;min-width:66px;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;line-height:1.25}

@media(max-width:860px){
 .sale{grid-template-columns:1fr}
 .crow{grid-template-columns:1fr 1fr 1fr}.crow.ch{display:none}.crow .cn{grid-column:1/-1}.crow .ct{text-align:left}.crow .cx{text-align:right}
 .crow>div[data-l]::before{content:attr(data-l);display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.05em}
 .prow{grid-template-columns:1fr 1fr 1fr}.prow.ph{display:none}.prow .pn,.prow .pp{grid-column:1/-1}.prow .r{text-align:left}
 .prow>div[data-l]::before{content:attr(data-l);display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.05em}
}
@media(prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translateY(8px)}}}

/* versiones de pantalla: PC horizontal (estilo punto de venta clásico) y móvil vertical */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 16px;font-weight:600;font-size:13px;color:var(--muted);min-height:34px}

.pc{display:grid;gap:12px}

.pc .cartw{min-height:330px}

.tbtn{display:none;border:1px solid var(--line);background:var(--surface2);color:var(--accent);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;min-height:0;margin-left:6px;line-height:1.6}

.sugt{font-size:11px;color:var(--muted)}body.m .sugt{display:none}

.ct2 .cq{display:flex;gap:4px;align-items:center;justify-content:flex-end}.ct2 .cq input{width:52px;text-align:center}
.pc-foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,460px);gap:16px;align-items:end}

const hx=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const toHx=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mixC=(a,b,t)=>{const A=hx(a),B=hx(b);return toHx(A.map((v,i)=>v+(B[i]-v)*t))};
const lumC=h=>{const [r,g,b]=hx(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};

function priceFor(p,li){const v=p.p[li];return v>0?v:(p.p[0]||0)}
function tierIdx(p,qty,li){if(li>=0)return li;let i=0;if(qty>=S.cfg.t2&&p.p[1]>0)i=1;if(qty>=S.cfg.t3&&p.p[2]>0)i=2;if(p.bulto>0&&qty>=p.bulto&&p.p[3]>0)i=3;return i}
function priceQty(p,qty,li){return priceFor(p,tierIdx(p,qty,li))}
function reprice(l){if(l.manual)return;const p=prod(l.pid);if(p)l.price=priceQty(p,l.qty,S.cart.list)}
function totalsFor(lines,gd){
  const rate=S.cfg.ivaRate/100,inc=S.cfg.incIva;let g0=0,gI=0,raw=0,all=0;const out=[];
  for(const l of lines){
    const rw=l.qty*l.price;raw+=rw;const g=r2(rw*(1-(l.disc||0)/100)*(1-(gd||0)/100));all+=g;
    let b=g,t=0;if(l.iva){if(inc){b=r2(g/(1+rate));t=r2(g-b)}else{t=r2(g*rate)}gI+=g}else g0+=g;
    out.push({...l,b,t,tot:r2(b+t)});
  }
  let sub0=r2(g0),subIva,iva,total;
  if(inc){const tI=r2(gI);subIva=r2(tI/(1+rate));iva=r2(tI-subIva);total=r2(sub0+tI)}
  else{subIva=r2(gI);iva=r2(subIva*rate);total=r2(sub0+subIva+iva)}
  return {sub0,subIva,iva,disc:r2(raw-all),total,lines:out};
}

function cedulaOk(c){if(!/^\d{10}$/.test(c))return false;const p=+c.slice(0,2);if(!((p>=1&&p<=24)||p===30))return false;if(+c[2]>5)return false;
  let s=0;for(let i=0;i<9;i++){let v=+c[i]*(i%2===0?2:1);if(v>9)v-=9;s+=v}return (10-s%10)%10===+c[9]}
function rucOk(r){if(!/^\d{13}$/.test(r))return false;const p=+r.slice(0,2);if(!((p>=1&&p<=24)||p===30))return false;const t=+r[2];
  if(t<6)return cedulaOk(r.slice(0,10))&&r.slice(10)!=='000';
  const calc=(co,pos)=>{let s=0;co.forEach((c,i)=>s+=+r[i]*c);let d=11-s%11;if(d===11)d=0;return d<10&&d===+r[pos]};
  if(t===9)return calc([4,3,2,7,6,5,4,3,2],9)&&r.slice(10)!=='000';
  if(t===6)return calc([3,2,7,6,5,4,3,2],8)&&r.slice(9)!=='0000';
  return false}
const TIPOS={cedula:'Cédula',ruc:'RUC',pasaporte:'Pasaporte',cf:'Consumidor final'};
function identErr(tipo,id){id=String(id||'').trim();if(tipo==='cf')return '';if(!id)return 'Ingrese la identificación.';
  if(tipo==='cedula'&&!cedulaOk(id))return 'La cédula no es válida (10 dígitos).';
  if(tipo==='ruc'&&!rucOk(id))return 'El RUC no es válido (13 dígitos).';return ''}

/* ---- búsqueda ---- */
function handleScan(v){
  v=v.trim();if(!v)return;let qty=1;const m=v.match(/^(\d+)\*(.+)$/);if(m){qty=+m[1];v=m[2].trim()}
  const act=S.products.filter(p=>p.active),ex=act.find(p=>p.code.toLowerCase()===v.toLowerCase());
  if(ex){addToCart(ex,qty);$('#q').value='';return}
  const bx=act.find(p=>p.boxCode&&p.boxCode.toLowerCase()===v.toLowerCase());
  if(bx){if(!(bx.bulto>0)){toast('Falta indicar las unidades por bulto de '+bx.name,1);return}addToCart(bx,qty*bx.bulto);toast(`Caja de ${bx.bulto}: ${bx.name}`);$('#q').value='';return}
  const f=act.filter(x=>matches(x,norm(v)));
  if(!f.length){toast('No se encontró: '+v,1);const bx2=$('#sugg');if(bx2)bx2.innerHTML=`<div class="muted small" style="padding:4px 2px">No existe «${esc(v)}».</div><button class="btn sm pri" data-act="newProdFromSale" data-q="${esc(v)}">＋ Crear producto nuevo</button>`;return}
  if(f.length===1){addToCart(f[0],qty);$('#q').value='';return}
  openPicker(v,qty)}
let PK={qty:1};
function openPicker(q,qty){PK={qty};modal(`${dlgHead('Hay varios productos, elija uno')}<input id="pk_q" value="${esc(q)}" data-inp="pkList" placeholder="Afine la búsqueda" autocomplete="off"><div id="pk_list" style="max-height:55vh;overflow:auto"></div><div class="muted small">Toque un producto o presione Enter para elegir el primero.</div>`,1);pkList();setTimeout(()=>{const i=$('#pk_q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},40)}
function pkList(){const q=norm(($('#pk_q')||{}).value||'').trim(),box=$('#pk_list');if(!box)return;
  const L=S.products.filter(p=>p.active&&(!q||matches(p,q))).slice(0,60);
  box.innerHTML=L.map(p=>`<button class="btn pkrow" data-act="pkPick" data-id="${p.id}"><span><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.code)}${p.track?' · stock '+p.stock:''}</span></span><span style="text-align:right"><b class="money">${money(priceQty(p,PK.qty,S.cart.list))}</b>${p.p[2]>0?`<br><span class="muted small">${esc(S.cfg.listNames[2])} ${money(p.p[2])}</span>`:''}</span></button>`).join('')||empty('Sin resultados.')}
function addToCart(p,qty){
  qty=qty||1;const ex=S.cart.lines.find(l=>l.pid===p.id),nq=(ex?ex.qty:0)+qty;
  if(p.track&&!S.cfg.allowNeg&&nq>p.stock){toast(`Stock insuficiente de ${p.name} (hay ${p.stock}).`,1);return}
  if(ex){ex.qty=nq;reprice(ex)}else{const l={pid:p.id,qty,price:0,disc:0,manual:false};reprice(l);S.cart.lines.push(l)}
  renderCart();save()}

/* ---- cliente en la venta ---- */
function guessTipo(id){return /^\d{10}$/.test(id)?'cedula':/^\d{13}$/.test(id)?'ruc':'pasaporte'}
function custView(){const c=S.cart;if(c.customerId==='cf')return {...emptyCust(),kind:'cf'};if(c.customerId==='new')return {...c.cust,kind:'new'};return {...cust(c.customerId),kind:'saved'}}

  if(v.kind==='cf')st='<span class="chip">Consumidor final</span>';else if(v.kind==='saved')st='<span class="chip ok">Cliente guardado</span>';

   ${F('name','Nombres / razón social','s2')}${F('tel','Teléfono')}${F('email','Correo','','email')}${F('addr','Dirección','s2')}</div>
   <div class="ft" style="margin-top:10px;justify-content:flex-start">${v.kind==='new'?'<button class="btn sm pri" data-act="saveNewCust">Guardar cliente</button>':''}<button class="btn sm" data-act="pickCustomer">Buscar cliente</button><button class="btn sm" data-act="newCust" data-from="venta">＋ Nuevo cliente</button>${v.kind!=='cf'?'<button class="btn sm" data-act="custClear">Consumidor final</button>':''}</div>`}
function saveNewCust(){
  const c=S.cart,d=c.cust,tipo=guessTipo(d.ident),e=identErr(tipo,d.ident);
  if(e){toast(e,1);const i=$('#cu_ident');i&&i.focus();return false}
  if(!String(d.name).trim()){toast('Ingrese el nombre del cliente.',1);const i=$('#cu_name');i&&i.focus();return false}
  const dup=S.customers.find(x=>x.ident===d.ident);if(dup){c.customerId=dup.id;c.cust=emptyCust();renderCust();return true}
  const id='c'+uid();S.customers.push({id,tipo,ident:d.ident,name:String(d.name).trim().toUpperCase(),tel:d.tel||'',email:d.email||'',addr:d.addr||''});
  c.customerId=id;c.cust=emptyCust();save(true);renderCust();toast('Cliente guardado.');return true}

/* ---- cobro ---- */
function openPay(){
  const L=cartLines();if(!L.length)return toast('Agregue productos al carrito.',1);
  if(!S.caja){toast('Abra la caja para cobrar.',1);location.hash='#venta';render();return}
  if(S.cart.customerId==='new'&&!saveNewCust())return;
  const T=curTotals(),c=cust(S.cart.customerId);
  if(c.id==='cf'&&!S.cart.credit&&T.total>S.cfg.cfLimit){toast(`Ventas mayores a ${money(S.cfg.cfLimit)} requieren cédula o RUC del cliente.`,1);const i=$('#cu_ident');i&&i.focus();return}
  for(const l of L){const p=prod(l.pid);if(p.track&&!S.cfg.allowNeg&&l.qty>p.stock)return toast(`Stock insuficiente de ${p.name}.`,1)}
  if(S.cart.credit){if(c.id==='cf'){toast('Elija el cliente para vender a crédito.',1);pickCustomer();return}return openPayCredit(T,c)}
  const bills=[...new Set([T.total,Math.ceil(T.total),5,10,20,50,100,Math.ceil(T.total/50)*50].filter(x=>x>=T.total))].sort((a,b)=>a-b).slice(0,6);
  const MODES=[['efectivo','💵 Efectivo'],['transferencia','🏦 Transferencia'],['tarjeta','💳 Tarjeta'],['qr','📱 Deuna / QR'],['mix','🔀 Combinado']];

  modal(`${dlgHead('Cobrar')}<div><div class="muted small">Total a pagar · ${esc(c.id==='cf'?'Consumidor final':c.name)}</div><div class="due money">${money(T.total)}</div></div>
  <div><div class="muted small" style="margin-bottom:6px">Forma de pago</div><div class="paymodes">${MODES.map(([m,n])=>`<button class="btn" data-act="payMode" data-m="${m}">${n}</button>`).join('')}</div></div>
  <div id="payrows" style="display:grid;gap:8px">${rows}</div>
  <div class="quick" id="payquick">${bills.map(x=>`<button class="btn" data-act="cashQuick" data-v="${x}">${x===T.total?'Exacto':money(x)}</button>`).join('')}</div>
  <div class="muted small" id="paymixhint" style="display:none">Ej.: total $20 → Efectivo $15 y pulse "Resto" en Transferencia para completar $5.</div>
  <div class="change" id="payInfo"></div>
  <div class="ft"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="confirmPay">Confirmar venta</button></div>`);
  setPayMode('efectivo');
  payInfo();
}
function setPayMode(m){
  const T=curTotals(),mix=m==='mix';
  document.querySelectorAll('.paymodes .btn').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  for(const k of ['efectivo','transferencia','tarjeta','qr']){
    const row=$('#prow_'+k),inp=$('#pay_'+k),show=mix||k===m;
    row.style.display=show?'':'none';
    inp.value=(!mix&&k===m)?T.total.toFixed(2):'';
    inp.classList.toggle('bigin',!mix);
    row.classList.toggle('single',!mix);
    row.querySelector('.btn').style.display=mix?'':'none';
  }
  $('#payquick').style.display=m==='efectivo'?'':'none';
  $('#paymixhint').style.display=mix?'':'none';

  const f=$('#pay_'+(mix?'efectivo':m));if(f){f.focus();f.select&&f.select()}
}
function payVals(){const o={};for(const k in PAY)o[k]=r2(num(($('#pay_'+k)||{}).value));return o}
function payInfo(){
  const T=curTotals(),v=payVals(),paid=r2(Object.values(v).reduce((a,b)=>a+b,0)),box=$('#payInfo');if(!box)return;const diff=r2(paid-T.total);

  else{box.className='change ok';box.innerHTML=`<span>Cambio a devolver</span><b>${money(diff)}</b>`}}
function confirmPay(){
  const T=curTotals(),v=payVals(),paid=r2(Object.values(v).reduce((a,b)=>a+b,0)),diff=r2(paid-T.total);
  if(diff<0)return toast('El pago no cubre el total.',1);if(diff>v.efectivo)return toast('Se pasa del total: solo el efectivo puede dar cambio. Ajuste transferencia/tarjeta.',1);
  const c=cust(S.cart.customerId);if(v.credito>0&&c.id==='cf')return toast('Elija un cliente para vender a crédito.',1);
  const pays=Object.entries(v).filter(([k,a])=>a>0).map(([m,amt])=>({m,amt}));
  finishSale(pays,Math.max(0,diff),0,'')}
function finishSale(pays,change,balance,due){
  const T=curTotals(),c=cust(S.cart.customerId);
  const sale={id:uid(),dev:DEV,num:nextNum(),ts:Date.now(),doc:S.cfg.docType,customerId:c.id,custName:c.name,custIdent:c.ident,custTipo:c.tipo,
    lines:T.lines.map(l=>({pid:l.pid,code:l.code,name:l.name,qty:l.qty,price:l.price,disc:l.disc||0,gd:S.cart.gd||0,iva:l.iva,cost:l.cost,b:l.b,t:l.t,tot:l.tot})),
    gd:S.cart.gd||0,sub0:T.sub0,subIva:T.subIva,iva:T.iva,disc:T.disc,total:T.total,ivaRate:S.cfg.ivaRate,incIva:S.cfg.incIva,
    pays,change,seller:S.cfg.cur||'',credit:balance>0,balance,due:due||'',abonos:[],status:'ok',sessionId:S.caja?S.caja.id:null};
  for(const l of sale.lines){const p=prod(l.pid);if(p&&p.track){p.stock=r2(p.stock-l.qty);S.moves.push({id:uid(),ts:sale.ts,pid:p.id,name:p.name,type:'venta',qty:-l.qty,ref:sale.num})}}
  if(S.moves.length>4000)S.moves=S.moves.slice(-3000);

function openPayCredit(T,c){

  <div class="payinfo"><span>Total de la venta</span><span class="money">${money(T.total)}</span></div>
  <div class="fgrid"><label class="f">Abono inicial en efectivo<input id="cr_ab" type="text" value="0" inputmode="decimal" data-inp="crInfo" autofocus></label><label class="f">Vence el (opcional)<input id="cr_due" type="date" min="${today()}" value="${S.cfg.crDays>0?addDays(today(),S.cfg.crDays):''}"></label></div>

function crInfo(){

function receiptText(s){
  const w=36,L=[];const c=(t)=>t.padStart(Math.floor((w+t.length)/2));const two=(a,b)=>a+' '.repeat(Math.max(1,w-a.length-b.length))+b;const C=S.cfg;
  const wrap=t=>{const o=[];let l='';for(const p of String(t).split(' ')){if((l+' '+p).trim().length>w){o.push(c(l.trim()));l=p}else l=(l+' '+p).trim()}if(l)o.push(c(l));return o};
  if(tk('name'))L.push(c(C.name));if(tk('ruc')&&C.ruc)L.push(c('RUC '+C.ruc));if(tk('addr')&&C.addr)L.push(c(C.addr));if(tk('tel')&&C.tel)L.push(c('Tel. '+C.tel));

  L.push('-'.repeat(w));if(tk('subtotals')&&s.subIva>0)L.push(two('Subtotal 0%',money(s.sub0)),two(`Subtotal ${s.ivaRate}%`,money(s.subIva)),two('IVA',money(s.iva)));L.push(two('TOTAL',money(s.total)),'-'.repeat(w));
  if(tk('payments')){for(const p of s.pays)L.push(two(PAY[p.m].n,money(p.amt)));if(s.change>0)L.push(two('Cambio',money(s.change)))}

function waText(s){

  if(s.disc>0)L.push(`🏷️ Descuento: ${money(s.disc)}`);
  L.push(`💰 *TOTAL: ${money(s.total)}*`);
  if(tk('payments')){L.push('');for(const p of s.pays)L.push(`${PAYE[p.m]||'💲'} ${PAY[p.m].n}: ${money(p.amt)}`);if(s.change>0)L.push(`🔄 Cambio: ${money(s.change)}`)}

  return L.join('\n')}

const IMPHEAD=['id','codigo','descripcion','Linea','costo','pvp1','pvp2','pvp3','pvp4','pagaIva','stockeable','existencia','habilitado','proveedor','unidades_bulto','codigo_caja'];
const IMPF=[['code','Código *',['codigo','cod','code','sku','barras','codigo de barras','cod barras','ean','referencia','item']],
['name','Descripción *',['descripcion','nombre','producto','detalle','articulo','description']],
['cost','Costo',['costo','precio compra','compra','costo unitario','cost']],
['p0','Precio unidad (PVP1)',['pvp1','precio','pvp','precio venta','precio unidad','precio unitario','venta','precio1','precio 1']],
['p1','Precio por mayor (PVP2)',['pvp2','mayor','precio mayor','por mayor','precio2','precio 2']],
['p2','Precio docena (PVP3)',['pvp3','docena','precio docena','precio3','precio 3']],
['p3','Precio bulto/caja (PVP4)',['pvp4','bulto','precio caja','precio bulto','precio4','precio 4']],
['line','Línea / categoría',['linea','categoria','grupo','familia','departamento','rubro']],
['iva','Cobra IVA',['pagaiva','iva','paga iva','grava iva','impuesto']],
['track','Controla inventario',['stockeable','inventariable','controla stock','maneja stock']],
['stock','Existencia / stock',['existencia','stock','cantidad','inventario','saldo','unidades']],
['active','Habilitado',['habilitado','activo','estado','disponible']],
['sup','Proveedor',['proveedor','supplier','distribuidor']],
['bulto','Unidades por caja/bulto',['unidades_bulto','unidades por bulto','unidades por caja','unid caja','und caja','x caja','unidades caja','por caja','contenido']],
['box','Código de la caja',['codigo_caja','codigo caja','cod caja','barras caja','codigo de la caja','ean caja']]];
const nk=h=>norm(h).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const numX=v=>{if(typeof v==='number')return v;let t=String(v??'').replace(/[^\d.,-]/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'').replace(',','.');else t=t.replace(',','.');const n=parseFloat(t);return isNaN(n)?0:n};
function impGuess(H){const used=new Set(),g={},hs=H.map(nk);
  for(const [k,,syn] of IMPF){const i=hs.findIndex((h,i)=>!used.has(i)&&syn.some(x=>nk(x)===h));if(i>=0){g[k]=i;used.add(i)}}
  for(const [k,,syn] of IMPF){if(g[k]!=null)continue;const i=hs.findIndex((h,i)=>!used.has(i)&&h&&syn.some(x=>{x=nk(x);return x.length>=4&&h.includes(x)}));if(i>=0){g[k]=i;used.add(i)}}
  return g}
async function importFile(file){
  if(!window.XLSX)return toast('No se pudo cargar el lector de Excel. Revise su conexión.',1);
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null,blankrows:false});
    const hi=aoa.findIndex(r=>r.filter(c=>c!=null&&String(c).trim()!=='').length>=2);if(hi<0)return toast('El archivo está vacío.',1);
    const H=aoa[hi].map((h,i)=>h==null||String(h).trim()===''?'Columna '+(i+1):String(h).trim());
    const R=aoa.slice(hi+1).filter(r=>r.some(c=>c!=null&&String(c).trim()!==''));if(!R.length)return toast('No hay filas de productos.',1);
    window._impR=R;const g=impGuess(H);
    modal(`${dlgHead('Importar productos')}<p class="muted small" style="margin:0">Se leyeron <b>${R.length}</b> filas. Indique qué columna de su archivo corresponde a cada dato; ya elegimos las que reconocimos. Lo que deje en "no importar" no se modifica.</p><div class="fgrid">${IMPF.map(([k,l])=>`<label class="f">${l}<select id="im_${k}"><option value="">— no importar —</option>${H.map((h,i)=>`<option value="${i}" ${g[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div><div class="ft"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="impMap">Continuar</button></div>`,1)}
  catch(e){toast('No se pudo leer el archivo.',1)}}
function impMap(){
  const m={};for(const [k] of IMPF)m[k]=$('#im_'+k).value;
  if(m.code===''||m.name==='')return toast('Indique la columna de código y la de descripción.',1);
  const T=v=>v===true||/^(true|si|sí|s|1|x|verdadero|activo|habilitado)$/i.test(String(v).trim());
  const g=(r,k)=>m[k]===''?undefined:r[+m[k]],N=(r,k)=>{const v=g(r,k);return v==null?null:numX(v)};const out=[];
  for(const r of window._impR){const code=String(g(r,'code')??'').trim(),name=String(g(r,'name')??'').trim();if(!code||!name||code==='PRUEBA'||code.startsWith('@'))continue;
    const iv=g(r,'iva'),tr=g(r,'track'),ac=g(r,'active');
    out.push({code,name:name.toUpperCase(),line:String(g(r,'line')??'').trim(),cost:N(r,'cost'),p:['p0','p1','p2','p3'].map(k=>N(r,k)),iva:iv==null?null:T(iv),track:tr==null?null:T(tr),active:ac==null?null:T(ac),stock:N(r,'stock'),sup:String(g(r,'sup')??'').trim(),bulto:Math.max(0,Math.floor(N(r,'bulto')||0)),box:String(g(r,'box')??'').trim()})}
  if(!out.length)return toast('No se encontraron filas con código y descripción.',1);
  const exist=new Set(S.products.map(p=>p.code.toLowerCase()));const nu=out.filter(o=>!exist.has(o.code.toLowerCase())).length;
  window._imp=out;modal(`${dlgHead('Importar productos')}<p style="margin:0">Se leyeron <b>${out.length}</b> productos: <b>${nu}</b> nuevos y <b>${out.length-nu}</b> que ya existen (se actualizarán solo los datos que eligió).</p>
    <label class="ck"><input type="checkbox" id="imp_stock"> Reemplazar también el stock de los productos que ya existen</label><div class="ft"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="impDo">Importar</button></div>`)}
function impDo(){const rs=$('#imp_stock').checked;let nu=0,up=0;
  for(const o of window._imp){const sid=o.sup?supByName(o.sup):'';const p=S.products.find(x=>x.code.toLowerCase()===o.code.toLowerCase());
    if(p){p.name=o.name;if(o.line)p.line=o.line;if(o.cost!=null)p.cost=o.cost;o.p.forEach((v,i)=>{if(v!=null)p.p[i]=v});if(o.iva!=null)p.iva=o.iva;if(o.active!=null)p.active=o.active;if(o.track!=null)p.track=o.track;if(sid)p.supplier=sid;if(o.bulto>0)p.bulto=o.bulto;if(o.box)p.boxCode=o.box;if(rs&&o.stock!=null&&p.track)p.stock=o.stock;up++}
    else{S.products.push({id:'p'+uid(),code:o.code,name:o.name,line:o.line||'',cost:o.cost||0,p:o.p.map(v=>v||0),iva:!!o.iva,track:o.track!=null?o.track:o.stock!=null,stock:o.stock>0?o.stock:0,min:0,active:o.active!=null?o.active:true,bulto:o.bulto||0,boxCode:o.box||'',supplier:sid});nu++}}
  window._imp=null;save(true);closeModal();toast(`Importación lista: ${nu} nuevos, ${up} actualizados.`);render()}

function cashStats(ses){
  let by={efectivo:0,tarjeta:0,transferencia:0,qr:0,credito:0},n=0,ab=0;
  for(const s of S.sales){if(s.sessionId===ses.id&&s.status==='ok'){n++;for(const p of s.pays)by[p.m]+=p.amt;by.efectivo-=s.change||0}
    if(s.status==='ok')for(const a of s.abonos||[])if(a.sessionId===ses.id){if(a.m==='efectivo')ab+=a.amt;else by[a.m]+=a.amt}}
  const ing=(ses.moves||[]).filter(m=>m.type==='ingreso').reduce((a,m)=>a+m.amt,0),egr=(ses.moves||[]).filter(m=>m.type==='egreso').reduce((a,m)=>a+m.amt,0);
  return {by,n,ab:r2(ab),ing:r2(ing),egr:r2(egr),expected:r2(ses.fondo+by.efectivo+ab+ing-egr)}}

   <div class="two"><div class="panel"><h3 style="margin-bottom:8px">Resumen del turno</h3><table><tbody>${Object.entries(st.by).map(([k,v])=>`<tr><td>${PAY[k].n}</td><td class="r money">${money(v)}</td></tr>`).join('')}<tr><td>Abonos en efectivo</td><td class="r money">${money(st.ab)}</td></tr><tr><td>Ingresos manuales</td><td class="r money">${money(st.ing)}</td></tr><tr><td>Egresos / gastos</td><td class="r money">-${money(st.egr)}</td></tr></tbody></table><div class="ft" style="margin-top:12px"><button class="btn" data-act="cashMove" data-t="ingreso">Ingreso de efectivo</button><button class="btn" data-act="cashMove" data-t="egreso">Retiro / gasto</button></div></div>

function repData(){R.f=$('#rf').value||R.f;R.t=$('#rt').value||R.t;return S.sales.filter(s=>s.ts>=dayStart(R.f)&&s.ts<=dayEnd(R.t))}
function repBody(){
  const all=repData(),L=all.filter(s=>s.status==='ok');
  const sum=f=>r2(L.reduce((a,s)=>a+f(s),0));const total=sum(s=>s.total),iva=sum(s=>s.iva),costo=r2(L.reduce((a,s)=>a+s.lines.reduce((x,l)=>x+l.cost*l.qty,0),0)),neto=r2(total-iva),util=r2(neto-costo);
  const by={};for(const s of L)for(const p of s.pays)by[p.m]=(by[p.m]||0)+p.amt-(p.m==='efectivo'?s.change:0);
  const days={};const month=dayStart(R.t)-dayStart(R.f)>31*864e5;for(const s of L){const k=month?dkey(s.ts).slice(0,7):dkey(s.ts);days[k]=(days[k]||0)+s.total}
  const keys=[];if(!month){for(let k=R.f;k<=R.t;k=addDays(k,1)){keys.push(k);if(keys.length>400)break}}else Object.keys(days).sort().forEach(k=>keys.push(k));

  <div class="two"><div class="panel"><h3 style="margin-bottom:8px">Por forma de pago</h3><table><tbody>${Object.entries(by).map(([k,v])=>`<tr><td>${PAY[k].n}</td><td class="r money">${money(v)}</td></tr>`).join('')}</tbody></table></div>

  ${owed.length?`<div class="panel" style="margin-top:16px"><h3 style="margin-bottom:8px">Cuentas por cobrar</h3><table><tbody>${owed.map(x=>`<tr><td>${esc(x.c.name)}</td><td class="r money">${money(x.d)}</td></tr>`).join('')}</tbody></table></div>`:''}

/* ===== SINCRONIZACIÓN (Supabase) ===== */
const SK=['products','customers','suppliers','sales','moves'];
function hsh(o,sk){const s=JSON.stringify(o,(k,v)=>k==='_u'||(sk&&k==='stock')?undefined:v);let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)+s.length}
function sHdr(){const h={apikey:S.cfg.syncKey,'Content-Type':'application/json'};if(S.cfg.syncKey.startsWith('eyJ'))h.Authorization='Bearer '+S.cfg.syncKey;return h}
function sStamp(){const sy=S.sync;for(const k of SK){if(k==='moves')continue;for(const o of S[k])if(sy.h[k+':'+o.id]!==hsh(o,k==='products'))o._u=Date.now()}}
function sApply(k,x){
  const sy=S.sync,key=x.id,id=key.slice(k.length+1),d=x.data,sk=k==='products';
  if(k==='moves'){if(id.startsWith(DEV+'-')||S.moves.some(m=>m.id===id))return 0;
    d._u=x.u;S.moves.push(d);sy.h[key]=hsh(d);const p=prod(d.pid);if(p&&p.track)p.stock=r2(p.stock+d.qty);return 1}
  d._u=x.u;const arr=S[k],i=arr.findIndex(o=>o.id===id);
  if(i<0){if(sk)d.stock=0;arr.push(d);sy.h[key]=hsh(d,sk);return 1}
  const l=arr[i],lh=hsh(l,sk);
  if(lh===hsh(d,sk)){sy.h[key]=lh;return 0}
  if(sy.started&&sy.h[key]!==lh&&(l._u||0)>(x.u||0))return 0;
  if(sk)d.stock=l.stock;arr[i]=d;sy.h[key]=hsh(d,sk);return 1}
async function sPull(){
  const sy=S.sync;let ch=0,n=0;
  for(;;){
    const q=sy.cur?'&srv=gte.'+encodeURIComponent(sy.cur):'';
    const r=await fetch(S.cfg.syncUrl+'/rest/v1/records?select=id,kind,data,u,srv&order=srv.asc&limit=1000'+q,{headers:sHdr()});
    if(!r.ok)throw new Error('descarga '+r.status);
    const rows=await r.json();n+=rows.length;
    for(const k of SK)for(const x of rows)if(x.kind===k)ch+=sApply(k,x);
    for(const x of rows)if(x.kind==='sellers'){for(const s of x.data.list)if(!S.sellers.includes(s)){S.sellers.push(s);ch++}sy.h['sellers:all']=hsh(x.data.list)}
    const same=rows.length&&rows[rows.length-1].srv===sy.cur;
    if(rows.length)sy.cur=rows[rows.length-1].srv;
    if(rows.length<1000||same)break}
  return {ch,n}}
async function sPush(){
  const sy=S.sync,out=[];
  for(const k of SK)for(const o of S[k]){const key=k+':'+o.id,h=hsh(o,k==='products');if(sy.h[key]!==h)out.push({key,h,row:{id:key,kind:k,data:o,u:o._u||o.ts||0,dev:DEV}})}
  const sh=hsh(S.sellers);if(sy.h['sellers:all']!==sh)out.push({key:'sellers:all',h:sh,row:{id:'sellers:all',kind:'sellers',data:{list:S.sellers},u:Date.now(),dev:DEV}});
  for(let i=0;i<out.length;i+=25){const c=out.slice(i,i+25);
    const r=await fetch(S.cfg.syncUrl+'/rest/v1/records?on_conflict=id',{method:'POST',headers:{...sHdr(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(c.map(x=>x.row))});
    if(!r.ok)throw new Error('envío '+r.status);
    c.forEach(x=>sy.h[x.key]=x.h)}
  return out.length}
async function runSync(manual){
  if(SY.busy)return;
  if(!S.cfg.syncUrl||!S.cfg.syncKey){if(manual)toast('Primero configure la nube.',1);return}
  if(S.cfg.offline||!navigator.onLine){if(manual)toast('Sin internet o en modo sin internet.',1);return}
  SY.busy=true;SY.msg='Sincronizando…';headState();let res;
  try{
    S.sync=S.sync||{h:{},cur:null,started:false};const sy=S.sync;
    if(sy.started)sStamp();else for(const m of S.moves)sy.h['moves:'+m.id]=hsh(m);
    const {ch,n}=await sPull();
    if(!sy.started){
      if(!n)for(const p of S.products)if(p.track&&p.stock)S.moves.push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,type:'ajuste',qty:p.stock,ref:'Saldo al sincronizar'});
      sy.started=true}
    sStamp();const sent=await sPush();
    SY.msg='✓ '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
    res={ch,sent}}
  catch(e){SY.msg='Error: '+e.message;if(manual)toast('No se pudo sincronizar ('+e.message+')',1)}
  save(true);SY.busy=false;headState();
  if(res){if(res.ch&&$('#modal').hidden)render();if(manual)toast('Sincronizado ✓')}}
function schedSync(){if(SY.busy||!S.cfg.syncUrl)return;clearTimeout(SY.t);SY.t=setTimeout(()=>runSync(),3000)}
setInterval(()=>runSync(),30000);window.addEventListener('online',()=>runSync());

/* ===================== CRÉDITOS ===================== */
var CR={f:'open',q:'',photo:''};
function crSales(cid,all){return S.sales.filter(s=>s.customerId===cid&&s.status==='ok'&&s.credit&&(all||s.balance>0)).sort((a,b)=>a.ts-b.ts)}
function crPaid(s){return r2((s.abonos||[]).reduce((a,x)=>a+x.amt,0))}
function crOrig(s){return r2(s.balance+crPaid(s))}
function crOver(s){return s.status==='ok'&&s.balance>0&&!!s.due&&s.due<today()}
function crClients(){
  const ids=[...new Set(S.sales.filter(s=>s.status==='ok'&&s.credit).map(s=>s.customerId))];
  return ids.map(id=>{const L=crSales(id,true),open=L.filter(s=>s.balance>0);return {c:cust(id),L,open,debt:r2(open.reduce((a,s)=>a+s.balance,0)),orig:r2(open.reduce((a,s)=>a+crOrig(s),0)),over:open.filter(crOver)}}).filter(x=>x.c)}
function vCreditos(){
  const D=crClients(),tot=r2(D.reduce((a,x)=>a+x.debt,0)),ven=r2(D.reduce((a,x)=>a+x.over.reduce((b,s)=>b+s.balance,0),0)),nv=D.filter(x=>x.over.length).length,nd=D.filter(x=>x.debt>0).length;
  $('#view').innerHTML=`<div class="bar"><h2 style="margin-right:auto">Créditos</h2><button class="btn" data-act="crAll">Recordar a vencidos${nv?' · '+nv:''}</button></div>
  <div class="kpis"><div class="panel"><div class="muted small">Nos deben en total</div><div class="due">${money(tot)}</div><div class="muted small">${nd} cliente(s) con deuda</div></div><div class="panel"><div class="muted small">Ya vencido</div><div class="due" style="color:var(--bad)">${money(ven)}</div><div class="muted small">${nv} cliente(s)</div></div></div>
  <div class="bar"><input id="crq" class="grow" placeholder="Buscar cliente" value="${esc(CR.q)}" data-inp="crList"><select id="crf" data-inp="crList">${[['open','Con deuda'],['paid','Pagados'],['all','Todos']].map(([k,n])=>`<option value="${k}" ${CR.f===k?'selected':''}>${n}</option>`).join('')}</select><label class="f" style="margin:0">Plazo por defecto (días)<input id="crd" inputmode="numeric" value="${S.cfg.crDays||0}" data-inp="crDays" style="width:90px"></label><button class="btn sm" data-act="crCleanAll">Quitar fotos de pagados</button></div><div id="crbody"></div>`;crList()}
function crDays(){S.cfg.crDays=Math.max(0,Math.floor(num($('#crd').value)));save()}
function crList(){
  CR.q=($('#crq')||{}).value||'';CR.f=($('#crf')||{}).value||'open';const q=norm(CR.q).trim(),box=$('#crbody');if(!box)return;
  let D=crClients().filter(x=>!q||norm(x.c.name+' '+x.c.ident).includes(q));
  if(CR.f==='open')D=D.filter(x=>x.debt>0);else if(CR.f==='paid')D=D.filter(x=>!x.debt);
  D.sort((a,b)=>b.over.length-a.over.length||b.debt-a.debt);
  box.innerHTML=D.length?D.map(crCard).join(''):empty('No hay créditos para mostrar.')}
function crCard(x){
  const c=x.c,paid=r2(x.orig-x.debt),pc=x.orig>0?Math.round(paid/x.orig*100):100,nx=x.open.map(s=>s.due).filter(Boolean).sort()[0];
  return `<div class="panel" style="margin-bottom:10px;display:grid;gap:8px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b class="grow" data-act="crOpen" data-id="${c.id}" style="cursor:pointer">${esc(c.name)}</b>${x.over.length?'<span class="pill bad">vencido</span>':''}${x.debt>0?`<b class="money">${money(x.debt)}</b>`:'<span class="pill ok">pagado</span>'}</div>
  ${x.debt>0?`<div class="prog"><i style="width:${pc}%"></i></div><div class="muted small">Pagado ${money(paid)} de ${money(x.orig)} (${pc}%)${nx?' · vence '+esc(nx):''}</div>`:`<div class="muted small">${x.L.length} crédito(s) pagado(s)</div>`}
  <div class="bar" style="margin:0"><button class="btn sm" data-act="crOpen" data-id="${c.id}">Detalle</button>${x.debt>0?`<button class="btn sm pri" data-act="collect" data-id="${c.id}">Abonar</button><button class="btn sm" data-act="crRemind" data-id="${c.id}">Recordar</button>`:''}</div></div>`}
function crDetail(cid){
  const c=cust(cid),L=crSales(cid,true).slice().reverse(),d=debt(cid);
  modal(`${dlgHead(esc(c.name))}<div class="muted small">${esc(c.tel||'Sin teléfono')} · Debe <b class="money">${money(d)}</b></div>
  ${L.map(s=>{const p=crPaid(s),o=crOrig(s),pc=o>0?Math.round(p/o*100):100,A=s.abonos||[],st=s.balance<=0?'ok':crOver(s)?'bad':'warn';return `<div class="panel" style="display:grid;gap:6px;margin-top:8px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b class="grow">${esc(s.num)}</b><span class="pill ${st}">${st==='ok'?'pagado':st==='bad'?'vencido':'pendiente'}</span></div><div class="prog"><i style="width:${pc}%"></i></div>
  <div class="small muted">Abierto: ${fmtDT(s.ts)}${s.due?' · vence '+esc(s.due):''}${s.paidTs?' · terminó de pagar: '+fmtDT(s.paidTs):''}<br>Crédito ${money(o)} · pagado ${money(p)} · <b>saldo ${money(s.balance)}</b>${s.seller?' · vendió '+esc(s.seller):''}</div>
  ${A.map((a,i)=>`<div class="small" style="border-top:1px solid var(--line);padding-top:4px">${fmtDT(a.ts)} · <b>${money(a.amt)}</b> · ${esc(PAY[a.m]?PAY[a.m].n:a.m)}${a.by?' · recibió '+esc(a.by):''}${a.note?`<div class="muted">${esc(a.note)}</div>`:''}${a.photo?` <button class="btn sm" data-act="crPhoto" data-s="${s.id}" data-i="${i}">Ver foto</button>`:''}</div>`).join('')}
  <div><button class="btn sm" data-act="crInv" data-s="${s.id}">Ver factura</button>${s.balance<=0&&A.some(a=>a.photo)?` <button class="btn sm" data-act="crClean" data-s="${s.id}">Quitar fotos</button>`:''}</div></div>`}).join('')}
  <div class="ft"><button class="btn" data-act="closeModal">Cerrar</button>${d>0?`<button class="btn" data-act="crRemind" data-id="${cid}">Recordar</button><button class="btn pri" data-act="collect" data-id="${cid}">Abonar</button>`:''}</div>`,1)}
function collectModal(cid){
  const c=cust(cid),d=debt(cid);CR.photo='';
  modal(`${dlgHead('Registrar abono')}<div><b>${esc(c.name)}</b><div class="muted">Saldo pendiente: <b class="money">${money(d)}</b></div></div>
  <div class="fgrid"><label class="f">Monto<input id="ab_amt" type="text" inputmode="decimal" autocomplete="off" value="${d}" autofocus></label><label class="f">Forma de pago<select id="ab_m">${['efectivo','transferencia','tarjeta','qr'].map(k=>`<option value="${k}">${PAY[k].n}</option>`).join('')}</select></label><label class="f">Fecha del abono<input id="ab_d" type="date" value="${today()}" max="${today()}"></label><label class="f">Quién recibió<input id="ab_by" value="${esc(S.cfg.cur||'')}" placeholder="Responsable"></label></div>
  <label class="f">Observaciones (opcional)<input id="ab_n" placeholder="Ej.: llevó 3 cajas, paga el resto el viernes"></label>
  <label class="f">Foto del comprobante (opcional)<input id="ab_f" type="file" accept="image/*"></label><div id="ab_p" class="muted small"></div>
  <p class="muted small" style="margin:0">El abono se aplica primero a las ventas más antiguas.${S.caja?'':' La caja está cerrada: el abono no se sumará a ningún arqueo.'}</p>
  <div class="ft"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="collectDo" data-id="${cid}">Registrar abono</button></div>`)}
function collectDo(cid){
  const amt0=r2(num($('#ab_amt').value)),m=$('#ab_m').value;let amt=amt0;
  if(amt<=0)return toast('Ingrese un monto.',1);if(amt>debt(cid))return toast('El monto supera la deuda.',1);
  const dk=$('#ab_d').value||today(),ts=dk===today()?Date.now():dayStart(dk)+12*36e5,by=$('#ab_by').value.trim(),note=$('#ab_n').value.trim();let first=true;
  for(const s of crSales(cid)){if(amt<=0)break;const a=Math.min(amt,s.balance);s.balance=r2(s.balance-a);s.abonos=s.abonos||[];
    s.abonos.push({ts,m,amt:a,by,note,photo:first?CR.photo:'',sessionId:S.caja?S.caja.id:null});first=false;if(s.balance<=0)s.paidTs=ts;amt=r2(amt-a)}
  CR.photo='';save(true);closeModal();toast('Abono registrado.');render()}
function imgShrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.55))};im.onerror=()=>res('');im.src=r.result};r.onerror=()=>res('');r.readAsDataURL(f)})}
document.addEventListener('change',async e=>{if(e.target.id!=='ab_f')return;const f=e.target.files[0],p=$('#ab_p');if(!f){CR.photo='';p.textContent='';return}
  p.textContent='Preparando foto…';CR.photo=await imgShrink(f);p.textContent=CR.photo?'Foto lista ✓':'No se pudo leer la foto.'});
function crText(cid){
  const c=cust(cid),L=crSales(cid),nm=c.name.split(' ')[0].toLowerCase().replace(/^./,x=>x.toUpperCase()),f=t=>new Date(t).toLocaleDateString('es-EC',{timeZone:TZ});
  const T=[`Hola ${nm}, le saluda *${S.cfg.name}* 👋`,'',`Le recordamos que tiene un saldo pendiente de *${money(debt(cid))}*:`];
  for(const s of L)T.push(`• ${s.num} (${f(s.ts)}): ${money(s.balance)}${s.due?' · vence '+s.due:''}${crOver(s)?' ⚠️ vencido':''}`);
  T.push('','Puede pagar en efectivo o por transferencia. ¡Gracias! 🙏');return T.join('\n')}
function crSend(cid){
  const c=cust(cid),n=waNum(c.tel);if(!n)return toast('El cliente no tiene un teléfono válido para WhatsApp.',1);
  for(const s of crSales(cid))s.rem=Date.now();save(true);
  const a=document.createElement('a');a.href='https://wa.me/'+n+'?text='+encodeURIComponent(crText(cid));a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function crAllModal(){
  const D=crClients().filter(x=>x.over.length),f=t=>new Date(t).toLocaleDateString('es-EC',{timeZone:TZ});
  modal(`${dlgHead('Recordar a clientes vencidos')}<p class="muted small" style="margin:0">WhatsApp abre el mensaje ya escrito y usted toca Enviar. La app no puede enviarlo sola sin el servicio de pago de WhatsApp Business.</p>
  ${D.length?D.map(x=>{const r=Math.max(0,...x.open.map(s=>s.rem||0));return `<div class="panel" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><div class="grow"><b>${esc(x.c.name)}</b><div class="muted small">${money(x.debt)} · ${r?'último aviso '+f(r):'sin avisos aún'}${x.c.tel?'':' · sin teléfono'}</div></div><button class="btn sm pri" data-act="crRemind" data-id="${x.c.id}">Enviar</button></div>`}).join(''):empty('No hay créditos vencidos. 🎉')}
  <div class="ft"><button class="btn" data-act="closeModal">Cerrar</button></div>`,1)}
function crCleanSale(s){let n=0;for(const a of s.abonos||[])if(a.photo){a.photo='';n++}return n}
Object.assign(A,{
  crOpen(el){crDetail(el.dataset.id)},crAll:crAllModal,
  crRemind(el){crSend(el.dataset.id)},
  crInv(el){const s=S.sales.find(x=>x.id===el.dataset.s);if(s)showReceipt(s)},
  crPhoto(el){const s=S.sales.find(x=>x.id===el.dataset.s),a=s&&s.abonos[+el.dataset.i];if(!a)return;modal(`${dlgHead('Comprobante')}<img src="${a.photo}" style="max-width:100%;border-radius:8px"><div class="ft"><button class="btn pri" data-act="crOpen" data-id="${s.customerId}">Volver</button></div>`)},
  crClean(el){const s=S.sales.find(x=>x.id===el.dataset.s);if(!s)return;confirmBox('Se borran las fotos de este crédito para ahorrar espacio. El crédito y sus abonos se conservan.',()=>{crCleanSale(s);save(true);toast('Fotos quitadas.');crDetail(s.customerId)},'Quitar fotos',1)},
  crCleanAll(){const L=S.sales.filter(s=>s.credit&&s.balance<=0&&(s.abonos||[]).some(a=>a.photo));if(!L.length)return toast('No hay fotos en créditos pagados.');confirmBox('Se borran las fotos de '+L.length+' crédito(s) ya pagados para ahorrar espacio. Los créditos y abonos se conservan.',()=>{L.forEach(crCleanSale);save(true);closeModal();toast('Listo, espacio liberado.')},'Quitar fotos',1)}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.chg&&CH[el.dataset.chg]){CH[el.dataset.chg](el);return}
  if(el.dataset.cfg){const k=el.dataset.cfg,t=el.dataset.t;S.cfg[k]=t==='b'?el.checked:t==='n'?num(el.value):el.value;if(k==='ivaRate')S.cfg.ivaRate=Math.min(100,Math.max(0,S.cfg.ivaRate));save(true);$('#bname').textContent=S.cfg.name||'STAR';headState();refreshPrev();toast('Guardado')}
  if(el.dataset.tk){S.cfg.tk=Object.assign({},S.cfg.tk,{[el.dataset.tk]:el.checked});save(true);refreshPrev();toast('Guardado')}
  if(el.dataset.cfglist){S.cfg.listNames[+el.dataset.cfglist]=el.value||('Precio '+(+el.dataset.cfglist+1));save(true);toast('Guardado')}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.cust){const c=S.cfg;c.custom=Object.assign({},CUSTOM_DEF,c.custom,{[el.dataset.cust]:el.value});if(c.theme!=='custom'){c.theme='custom';$$('.tcard').forEach(b=>b.classList.remove('on'));const t=$('#tc_custom');t&&t.classList.add('on')}
    applyTheme();const t=$('#tc_custom .sw');if(t){const q=c.custom;t.innerHTML=[q.bg,q.surface,q.accent,q.fg].map(x=>`<i style="background:${x}"></i>`).join('')}save();return}if(el.dataset.inp&&IN[el.dataset.inp])IN[el.dataset.inp](el);
  if(el.id==='pu_q')puRender();
  if(el.id==='e_p0'||el.id==='e_cost')margin()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  const t=e.target;
  if(e.key==='Enter'){
    if(t.id==='q'){e.preventDefault();handleScan(t.value);const sg=$('#sugg');if(sg)sg.innerHTML='';return}
    if(t.id==='pu_q'){e.preventDefault();const q=norm(t.value).trim();const f=S.products.filter(p=>p.code.toLowerCase()===t.value.trim().toLowerCase()||matches(p,q));if(f.length){puAdd(f[0]);t.value='';puRender();t.focus()}return}
    if(t.id==='pk_q'){e.preventDefault();const b=$('#pk_list .pkrow');b&&b.click();return}
    if(t.id==='cu_ident'){e.preventDefault();t.blur();return}
    if(t.id&&t.id.startsWith('pay_')){e.preventDefault();confirmPay();return}
    if(t.id==='cc_amt'){A.closeCajaDo();return}
    if(t.id==='cr_ab'){e.preventDefault();crDo();return}
  }
  if(view==='venta'&&$('#modal').hidden){
    if(e.key==='F1'){e.preventDefault();$('#q').focus()}
    if(e.key==='F2'){e.preventDefault();openPay()}
    if(e.key==='F4'){e.preventDefault();A.hold()}}
});
document.addEventListener('click',e=>{if(e.target.closest('nav a')){menuOpen=false;document.body.classList.remove('menu')}});
function labelTables(){$$('#view table, #modal table').forEach(t=>{const H=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());if(!H.length)return;t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(!td.dataset.l&&H[i])td.dataset.l=H[i]}))})}
new MutationObserver(labelTables).observe(document.body,{childList:true,subtree:true});
window.addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Hay una versión nueva. Recargue la página para usarla.')})})}).catch(()=>{})}
</script>
